# 규칙 엔진(RuleValidator)이 바뀌면 Fairy-Stockfish의 수 생성과 무작위 대국으로 대조한다.
# Unity 없이 .NET만으로 실행 (엔진은 Windows용 실행 파일이라 Windows 러너 사용)
name: Rule check

on:
  push:
    paths:
      - "Assets/Scripts/Core/**"
      - "Tools/RuleCheck/**"
      - ".github/workflows/rule-check.yml"
  pull_request:
    paths:
      - "Assets/Scripts/Core/**"
      - "Tools/RuleCheck/**"
  workflow_dispatch:

jobs:
  rule-check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Compare legal moves with Fairy-Stockfish (40 random games)
        working-directory: Tools/RuleCheck
        run: dotnet run -c Release -- ${{ github.run_number }} 40
      - name: Same with bikjang rule (janggitraditional, 40 random games)
        working-directory: Tools/RuleCheck
        run: dotnet run -c Release -- ${{ github.run_number }} 40 janggitraditional
